# go-release.yml — the fleet-canonical release pipeline, reusable across the cliwright Go CLIs.
# Callers replace their release.yml body with a single `uses:` of this file, so the GoReleaser
# action version, cosign/syft setup, and go-version handling live in ONE place instead of drifting
# per repo (this fleet had goreleaser-action v6/v7 and cosign-installer v3/v4 scattered around).
#
# The GoReleaser CONFIG (.goreleaser.yaml) stays per-repo and is already validated on every push by
# the reusable go-ci build job (`goreleaser check` + snapshot). This workflow only wires the
# publish: real `release --clean`, keyless cosign signing, SBOM, GHCR, and the brew/scoop bumps.
name: Release

on:
  workflow_call:
    inputs:
      promote-main:
        description: "After releasing, fast-forward the default branch to the tagged commit (git-flow: releases are tagged on develop, so main must be kept current). Fails loudly if main has diverged. Off by default."
        type: boolean
        default: false
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false # repo-scoped PAT to push brew/scoop manifests to the separate tap/bucket repos

permissions:
  contents: write # create the GitHub release
  packages: write # push the Docker image to GHCR (if the goreleaser config builds one)
  id-token: write # cosign keyless signing via OIDC

jobs:
  release:
    # Skip pre-releases (v1.2.3-rc1) and CI probe tags (v0.0.0-citest): release only from clean tags.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # git-flow repos (promote-main: true): keep the default branch pointing at the released
      # commit so it never falls behind a published release. Fast-forward only — fails loudly if
      # main diverged. Reuses the fetch-depth:0 checkout above.
      - name: Promote main to the released commit
        if: ${{ inputs.promote-main && !contains(github.ref_name, '-') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            git push origin "HEAD:refs/heads/main"
            echo "Fast-forwarded main to ${GITHUB_REF_NAME}"
          else
            echo "::error::main is not an ancestor of ${GITHUB_REF_NAME}; cannot fast-forward — promote main manually."
            exit 1
          fi
