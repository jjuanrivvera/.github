# go-ci.yml — the fleet-canonical CI, reusable across every cliwright Go CLI.
#
# Callers replace their own ci.yml jobs with a single `uses:` of this file, so CI policy for the
# whole fleet lives in ONE place. To change how the fleet lints/tests/scans, edit this file — not
# N repos.
#
# Two deliberate choices, each a lesson paid for once:
#   1. go-version-file: go.mod (NOT go-version: stable). `stable` silently grabs the newest Go, so
#      govulncheck runs against an already-patched stdlib and stays green even when the repo's
#      declared toolchain floor is behind — the CVE hides. Reading the floor from go.mod makes CI
#      test what users actually build, and go red when the floor needs a bump.
#   2. Build golangci-lint / gosec / govulncheck FROM SOURCE with this job's Go (@latest), never the
#      prebuilt actions. The prebuilt binaries lag the toolchain and reject a module already on the
#      next Go release ("configuration contains invalid elements").
name: Go CI

on:
  workflow_call:
    inputs:
      coverage-threshold:
        description: "Minimum coverage % enforced by scripts/cover-check.sh; empty string skips the gate."
        type: string
        default: "80"
      coverpkg:
        description: "Add -coverpkg=./... so cross-package integration tests are credited (repos whose coverage relies on integration tests, e.g. a commands_test that drives internal/api)."
        type: boolean
        default: false
      run-gosec:
        description: "Run the gosec high-severity gate."
        type: boolean
        default: true
      run-docs-check:
        description: "Run `make docs-gen` and fail if the generated docs drift from what's committed."
        type: boolean
        default: true
      run-build:
        description: "Run the goreleaser check + snapshot build job (turn off for repos whose .goreleaser config still uses deprecated properties, until it's modernized)."
        type: boolean
        default: true
      os-matrix:
        description: "JSON array of runner OSes for the test job."
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - name: golangci-lint (built from source with this job's Go)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run ./...
      - name: docs-gen drift check
        if: ${{ inputs.run-docs-check }}
        run: make docs-gen && git diff --exit-code

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck (blocking)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec (high-severity gate)
        if: ${{ inputs.run-gosec }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -confidence medium ./...

  test:
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ${{ inputs.coverpkg && '-coverpkg=./...' || '' }} ./... -coverprofile=coverage.out
      - name: coverage gate (ubuntu only)
        if: ${{ inputs.coverage-threshold != '' && matrix.os == 'ubuntu-latest' }}
        # Inlined rather than ./scripts/cover-check.sh so the gate works for every repo, including
        # those without that script. Identical computation: the total% from `go tool cover -func`.
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/,"",$3); print $3 }')
          awk -v p="$pct" -v t="${{ inputs.coverage-threshold }}" 'BEGIN {
            if (p+0 < t+0) { printf "✗ coverage %.1f%% < %s%%\n", p, t; exit 1 }
            printf "✓ coverage %.1f%% ≥ %s%%\n", p, t
          }'

  build:
    if: ${{ inputs.run-build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, so goreleaser derives a real version (not 0.0.0-SNAPSHOT)
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0 # syft on PATH so the SBOM step can't fail
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --snapshot --clean --skip=sign,docker
